name: Build Monaspace Profiles

on:
  workflow_call:
    inputs:
      version:
        description: "Monaspace release tag (e.g. v1.200.0)"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  download-and-unzip:
    name: Download and unzip monaspace ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve release asset URLs
        id: resolve
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          result-encoding: json
          script: |
            const version = `${{ inputs.version }}`;
            try {
              const { data: rel } = await github.rest.repos.getReleaseByTag({
                owner: 'githubnext',
                repo: 'monaspace',
                tag: version,
              });
              const assets = rel.assets || [];
              
              // Find the three required zip files
              const variableZip = assets.find(a => a.name && a.name.includes('variable') && a.name.endsWith('.zip'));
              const staticZip = assets.find(a => a.name && a.name.includes('static') && a.name.endsWith('.zip') && !a.name.includes('webfont'));
              const frozenZip = assets.find(a => a.name && a.name.includes('frozen') && a.name.endsWith('.zip') && !a.name.includes('webfont'));
              
              if (!variableZip || !staticZip || !frozenZip) {
                core.setFailed(`Missing required zip assets for monaspace release ${version}. Found: variable=${!!variableZip}, static=${!!staticZip}, frozen=${!!frozenZip}`);
                return;
              }
              
              core.info(`Selected assets: ${variableZip.name}, ${staticZip.name}, ${frozenZip.name}`);
              return {
                variable: { url: variableZip.browser_download_url, name: variableZip.name },
                static: { url: staticZip.browser_download_url, name: staticZip.name },
                frozen: { url: frozenZip.browser_download_url, name: frozenZip.name }
              };
            } catch (err) {
              core.setFailed(`Failed to resolve monaspace release ${version}: ${err.message}`);
            }
      - name: Download assets
        run: |
          set -euo pipefail
          variable_url="${{ fromJson(steps.resolve.outputs.result).variable.url }}"
          variable_name="${{ fromJson(steps.resolve.outputs.result).variable.name }}"
          static_url="${{ fromJson(steps.resolve.outputs.result).static.url }}"
          static_name="${{ fromJson(steps.resolve.outputs.result).static.name }}"
          frozen_url="${{ fromJson(steps.resolve.outputs.result).frozen.url }}"
          frozen_name="${{ fromJson(steps.resolve.outputs.result).frozen.name }}"
          
          echo "Downloading $variable_name from $variable_url"
          curl -L --fail -o "$variable_name" "$variable_url"
          
          echo "Downloading $static_name from $static_url"
          curl -L --fail -o "$static_name" "$static_url"
          
          echo "Downloading $frozen_name from $frozen_url"
          curl -L --fail -o "$frozen_name" "$frozen_url"
      - name: Unzip assets
        run: |
          set -euo pipefail
          variable_name="${{ fromJson(steps.resolve.outputs.result).variable.name }}"
          static_name="${{ fromJson(steps.resolve.outputs.result).static.name }}"
          frozen_name="${{ fromJson(steps.resolve.outputs.result).frozen.name }}"
          
          mkdir -p monaspace/{variable,otf,frozen}
          mkdir -p monaspace/{otf,frozen}/{argon,krypton,neon,radon,xenon}
          
          # Extract variable fonts
          unzip -j "$variable_name" "Variable Fonts/Monaspace*/*" -x "*/.*" -d monaspace/variable
          
          # Extract static fonts (formerly OTF)
          unzip -j "$static_name" "Static Fonts/Monaspace Argon/*" -x "*/.*" -d monaspace/otf/argon
          unzip -j "$static_name" "Static Fonts/Monaspace Krypton/*" -x "*/.*" -d monaspace/otf/krypton
          unzip -j "$static_name" "Static Fonts/Monaspace Neon/*" -x "*/.*" -d monaspace/otf/neon
          unzip -j "$static_name" "Static Fonts/Monaspace Radon/*" -x "*/.*" -d monaspace/otf/radon
          unzip -j "$static_name" "Static Fonts/Monaspace Xenon/*" -x "*/.*" -d monaspace/otf/xenon
          
          # Extract frozen fonts
          unzip -j "$frozen_name" "Frozen Fonts/Monaspace Argon/*" -x "*/.*" -d monaspace/frozen/argon
          unzip -j "$frozen_name" "Frozen Fonts/Monaspace Krypton/*" -x "*/.*" -d monaspace/frozen/krypton
          unzip -j "$frozen_name" "Frozen Fonts/Monaspace Neon/*" -x "*/.*" -d monaspace/frozen/neon
          unzip -j "$frozen_name" "Frozen Fonts/Monaspace Radon/*" -x "*/.*" -d monaspace/frozen/radon
          unzip -j "$frozen_name" "Frozen Fonts/Monaspace Xenon/*" -x "*/.*" -d monaspace/frozen/xenon
          
          rm -f "$variable_name" "$static_name" "$frozen_name"
      - name: Build Variable
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/variable" \
            --fontname="Monaspace Variable"
      - name: Build Frozen
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/frozen" \
            --fontname="Monaspace Frozen"
      - name: Build OTF Argon
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/otf/argon" \
            --fontname="Monaspace OTF Argon"
      - name: Build OTF Krypton
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/otf/krypton" \
            --fontname="Monaspace OTF Krypton"
      - name: Build OTF Neon
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/otf/neon" \
            --fontname="Monaspace OTF Neon"
      - name: Build OTF Radon
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/otf/radon" \
            --fontname="Monaspace OTF Radon"
      - name: Build OTF Xenon
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/otf/xenon" \
            --fontname="Monaspace OTF Xenon"
      - name: Build Frozen Argon
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/frozen/argon" \
            --fontname="Monaspace Frozen Argon"
      - name: Build Frozen Krypton
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/frozen/krypton" \
            --fontname="Monaspace Frozen Krypton"
      - name: Build Frozen Neon
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/frozen/neon" \
            --fontname="Monaspace Frozen Neon"
      - name: Build Frozen Radon
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/frozen/radon" \
            --fontname="Monaspace Frozen Radon"
      - name: Build Frozen Xenon
        run: |
          node scripts/build-profile.js \
            --version="${{ inputs.version }}" \
            --dir="monaspace/frozen/xenon" \
            --fontname="Monaspace Frozen Xenon"
      - name: Upload bundle
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: Monaspace Configs
          path: "*.mobileconfig"
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
